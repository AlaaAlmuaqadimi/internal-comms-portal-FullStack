# ============================================================================
# Local development stack: MySQL 8 + Redis
#
#   cp .env.example .env      # then edit the secrets
#   docker compose up -d
#   docker compose exec mysql mysqladmin ping -uroot -p   # health
#
# Migrations in ./database/migrations are applied automatically on the FIRST
# initialization of the mysql_data volume (MySQL's docker-entrypoint-initdb.d,
# run in filename order V001..V010). To re-apply from scratch:
#   docker compose down -v && docker compose up -d
#
# For production, run the migrations with Flyway against a hardened MySQL
# (see database/security/) using a dedicated migration account - never the app
# user. The app runtime account (MYSQL_USER) is granted ALL on its database by
# the image, which is acceptable for local dev only.
# ============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: icp-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-internal_comms}
      MYSQL_USER: ${MYSQL_USER:-app_rw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - icp

  redis:
    image: redis:7-alpine
    container_name: icp-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - icp

volumes:
  mysql_data:
  redis_data:

networks:
  icp:
    driver: bridge
